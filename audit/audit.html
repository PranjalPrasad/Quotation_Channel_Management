<!-- ============ audit.html (Super Admin only; uses /api/audit via session.js) ============ -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Sun Greaves EcoTech Software</title>

<!-- Tailwind CDN (same theme as every module) -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          peach: {
            50:  "#FBF6EF",
            100: "#F1E2D1",
            200: "#E4CBAE",
            300: "#DCC3AA",
            400: "#A8446B",
            500: "#810B38",
            600: "#6B0930",
            700: "#541A1A",
          },
          cream: "#F7ECE1",
        },
        fontFamily: {
          sans: ["Poppins", "ui-sans-serif", "system-ui"],
        },
        borderRadius: {
          "3xl": "1.75rem",
          "4xl": "2rem",
        },
      },
    },
  };
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- shared design-system stylesheet used by every module -->
<link rel="stylesheet" href="/dashboard/dashboard.css" />
<!-- reuses the filter-input look of the channel partner screen -->
<link rel="stylesheet" href="/channel-partner/channel.css" />
<!-- audit-specific additions -->
<link rel="stylesheet" href="/audit/audit.css" />
</head>
<body class="bg-cream">

  <div class="app-shell w-full flex">

    <div id="sidebarBackdrop" class="sidebar-backdrop hidden"></div>

    <!-- ===================== SIDEBAR (generated by session.js) ===================== -->
    <aside id="sidebar" class="sidebar expanded app-sidebar relative flex flex-col items-center py-5 gap-6 bg-cream border-r border-peach-300 transition-all duration-300 ease-in-out w-20 shrink-0">
      <button id="sidebarToggle" aria-label="Toggle sidebar" class="absolute -right-3 top-8 w-6 h-6 rounded-full bg-cream shadow-md border border-peach-300 flex items-center justify-center text-peach-500 hover:scale-110 transition-transform">
        <svg id="toggleIcon" class="w-3.5 h-3.5 transition-transform duration-300" style="transform: rotate(180deg)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>

      <div class="flex items-center justify-center shrink-0">
        <img src="/img/logo.webp" alt="Company Logo" class="w-auto h-10 object-contain" />
      </div>

      <nav id="sidebarNav" class="nav-list w-full flex-1 flex flex-col items-center gap-1.5 mt-3 px-3" data-active="audit"></nav>
    </aside>

    <!-- ===================== MAIN ===================== -->
    <main class="app-main flex-1 bg-cream px-4 sm:px-5 md:px-6 py-4 min-w-0">

      <!-- top bar -->
      <div class="flex items-center justify-between mb-4 gap-3 flex-wrap">
        <div class="min-w-0">
          <h1 class="text-sm font-semibold text-gray-800 m-0">Audit Log</h1>
          <p class="text-[11px] text-gray-400 m-0 mt-0.5">Who did what, in which partner account, and when</p>
        </div>

        <div class="flex items-center gap-2.5 relative">
          <div class="relative">
            <button id="profileBtn" aria-label="Profile" class="w-8 h-8 rounded-full bg-peach-500 flex items-center justify-center text-white font-semibold text-sm shadow-sm">
              <span id="profileInitial">U</span>
            </button>
            <div id="profileDropdown" class="topbar-dropdown hidden">
              <div id="profileNameLabel" class="text-xs font-semibold text-gray-700" style="padding:4px 6px 0;">User</div>
              <p id="profileRoleLabel" class="topbar-dropdown-title" style="padding:2px 6px 2px;">Logged in as: —</p>
              <button id="profileLogoutBtn" class="topbar-logout-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                Logout
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- ============ Log list ============ -->
      <div class="bg-cream rounded-xl p-3.5 shadow-sm border border-peach-300 mb-3 min-w-0">
        <div class="flex items-center justify-between mb-2.5 flex-wrap gap-2">
          <div>
            <h2 class="text-xs font-semibold text-gray-700">Activity</h2>
            <p class="text-[10.5px] text-gray-400" id="auditSummary">Loading…</p>
          </div>
          <button id="exportBtn" type="button" class="bg-peach-500 hover:bg-peach-600 transition-colors text-white text-xs font-medium px-3.5 py-1.5 rounded-lg shadow-sm flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            Export CSV
          </button>
        </div>

        <!-- Filters -->
        <form id="auditFilters" class="audit-filters" onsubmit="return false;" autocomplete="off">
          <div class="audit-filter audit-filter--search">
            <label class="audit-filter-label" for="fSearch">Search</label>
            <input id="fSearch" type="text" class="partner-filter-input w-full" placeholder="User name or record name…" maxlength="100" />
          </div>
          <div class="audit-filter">
            <label class="audit-filter-label" for="fPartner">Partner</label>
            <select id="fPartner" class="partner-filter-input partner-filter-select w-full">
              <option value="">All partners</option>
            </select>
          </div>
          <div class="audit-filter">
            <label class="audit-filter-label" for="fUser">User</label>
            <select id="fUser" class="partner-filter-input partner-filter-select w-full" disabled>
              <option value="">Choose a partner first</option>
            </select>
          </div>
          <div class="audit-filter">
            <label class="audit-filter-label" for="fModule">Module</label>
            <select id="fModule" class="partner-filter-input partner-filter-select w-full">
              <option value="">All modules</option>
              <option value="AUTH">Login / Logout</option>
              <option value="CUSTOMER">Customer</option>
              <option value="PRODUCT">Product</option>
              <option value="PROJECT">Project</option>
              <option value="QUOTATION">Quotation</option>
              <option value="CALCULATOR">Calculator</option>
              <option value="REFERRAL">Referral</option>
              <option value="USER">User</option>
              <option value="ROLE">Role</option>
              <option value="SETTINGS">Settings</option>
              <option value="CHANNEL_PARTNER">Channel Partner</option>
            </select>
          </div>
          <div class="audit-filter">
            <label class="audit-filter-label" for="fAction">Action</label>
            <select id="fAction" class="partner-filter-input partner-filter-select w-full">
              <option value="">All actions</option>
              <option value="CREATE">Create</option>
              <option value="UPDATE">Update</option>
              <option value="DELETE">Delete</option>
              <option value="STATUS_CHANGE">Status change</option>
              <option value="APPROVE">Approve</option>
              <option value="REJECT">Reject</option>
              <option value="CONVERT">Convert</option>
              <option value="MARK_PAID">Mark paid</option>
              <option value="PERMISSION_CHANGE">Permission change</option>
              <option value="LOGIN">Login</option>
              <option value="LOGOUT">Logout</option>
              <option value="PASSWORD_RESET">Password reset</option>
            </select>
          </div>
          <div class="audit-filter audit-filter--date">
            <label class="audit-filter-label" for="fFrom">From</label>
            <input id="fFrom" type="date" class="partner-filter-input w-full" title="Dates are matched in UTC" />
          </div>
          <div class="audit-filter audit-filter--date">
            <label class="audit-filter-label" for="fTo">To</label>
            <input id="fTo" type="date" class="partner-filter-input w-full" title="Dates are matched in UTC" />
          </div>
          <div class="audit-filter audit-filter--reset">
            <button id="resetBtn" type="button" class="btn-secondary">Clear filters</button>
          </div>
        </form>

        <div class="table-scope overflow-x-auto">
          <table class="data-table audit-table" id="auditTable">
            <thead>
              <tr>
                <th data-key="createdAt" class="col-time">Time <span class="sort-icon">⇅</span></th>
                <th class="col-partner">Partner</th>
                <th data-key="actorName" class="col-user">User <span class="sort-icon">⇅</span></th>
                <th data-key="module" class="col-module">Module <span class="sort-icon">⇅</span></th>
                <th data-key="action" class="col-action">Action <span class="sort-icon">⇅</span></th>
                <th class="col-record">Record</th>
                <th class="col-ip">IP / Browser</th>
              </tr>
            </thead>
            <tbody id="auditTbody"></tbody>
          </table>
        </div>

        <div class="flex items-center justify-between mt-2 flex-wrap gap-2">
          <div class="flex items-center gap-2 text-[10.5px] text-gray-400 flex-wrap">
            <span>Rows per page</span>
            <select id="rowsPerPage" class="rows-select">
              <option value="10">10</option>
              <option value="25" selected>25</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
            <span id="rowsRangeLabel"></span>
          </div>
          <div id="paginationControls" class="flex items-center gap-1 flex-wrap"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- ============ Log detail modal ============ -->
  <div id="auditModal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="auditModalTitle">
    <div class="modal-panel modal-panel--xwide">
      <div class="modal-header">
        <div>
          <div id="auditModalTitle" class="modal-title">Log details</div>
          <div id="auditModalSub" class="modal-subtitle"></div>
        </div>
        <button id="auditModalClose" class="modal-close-btn" title="Close" aria-label="Close">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="modal-body modal-body--block" id="auditModalBody"></div>
      <div class="modal-footer">
        <button type="button" id="auditModalDone" class="btn-secondary">Close</button>
      </div>
    </div>
  </div>

  <div id="toast-container" class="fixed bottom-5 right-5 z-[600] space-y-2 max-w-[calc(100vw-2.5rem)]"></div>

<script src="/session.js"></script>
<script src="/audit/audit.js"></script>
</body>
</html>
