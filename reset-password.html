<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sun Greaves EcoTech Software</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/img/logo.webp" />
    <link rel="icon" type="image/png" sizes="192x192" href="/img/logo.webp" />
    <link rel="apple-touch-icon" href="/img/logo.webp" />
    <meta name="theme-color" content="#541A1A" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Roboto', sans-serif; background: #F7ECE1; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: #fff; width: 100%; max-width: 420px; border-radius: 20px; border: 1.5px solid #DCC3AA; border-top: 4px solid #541A1A;
                box-shadow: 0 20px 40px -12px rgba(84,26,26,.18); padding: 32px 28px; }
        .logo { display: flex; justify-content: center; margin-bottom: 16px; }
        .logo img { max-height: 48px; width: auto; }
        h1 { color: #541A1A; font-size: 22px; font-weight: 700; margin-bottom: 6px; }
        .sub { color: #6b7280; font-size: 13px; margin-bottom: 22px; line-height: 1.5; }
        .group { margin-bottom: 16px; }
        label { display: block; font-size: 12px; font-weight: 500; color: #374151; margin-bottom: 6px; }
        .wrap { position: relative; }
        .wrap > i.lead { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #B9997C; font-size: 13px; }
        .wrap > i.eye { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: #B9997C; font-size: 13px; cursor: pointer; }
        .wrap > i.eye:hover { color: #541A1A; }
        input { width: 100%; padding: 10px 38px; border: 1.5px solid #DCC3AA; border-radius: 10px; font: inherit; font-size: 13px; color: #1F2937; background: #fff; }
        input:focus { outline: none; border-color: #541A1A; box-shadow: 0 0 0 2px rgba(84,26,26,.15); }
        .hint { font-size: 11px; color: #6b7280; margin-top: 6px; }
        .alert { display: none; align-items: center; gap: 8px; padding: 10px; border-radius: 10px; font-size: 12px; margin-bottom: 16px; }
        .alert.error { background: #FFE4E6; color: #9F1239; border: 1px solid #FBCFE0; }
        .alert.ok { background: #D1FAE5; color: #047857; border: 1px solid #A7F3D0; }
        button.primary { width: 100%; padding: 11px; border: 0; border-radius: 10px; background: #541A1A; color: #fff; font: inherit; font-size: 14px; font-weight: 500;
                         cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background .2s; }
        button.primary:hover { background: #810B38; }
        button.primary:disabled { opacity: .7; cursor: not-allowed; }
        .back { display: block; text-align: center; margin-top: 16px; font-size: 12px; color: #810B38; text-decoration: none; }
        .back:hover { text-decoration: underline; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <main class="card">
        <div class="logo"><img src="/img/logo.webp" alt="Company Logo" onerror="this.style.display='none'"></div>
        <h1>Set a new password</h1>
        <p class="sub" id="sub">Choose a new password for your account. It must be at least 8 characters and contain a letter and a number.</p>

        <div id="alert" class="alert" role="alert"><i class="fas fa-exclamation-triangle"></i><span id="alertMsg"></span></div>

        <form id="form" novalidate>
            <div class="group">
                <label for="pw">New password</label>
                <div class="wrap">
                    <i class="fas fa-lock lead"></i>
                    <input type="password" id="pw" autocomplete="new-password" placeholder="Enter new password" required>
                    <i class="fas fa-eye eye" data-for="pw" role="button" aria-label="Show password"></i>
                </div>
            </div>
            <div class="group">
                <label for="pw2">Confirm password</label>
                <div class="wrap">
                    <i class="fas fa-lock lead"></i>
                    <input type="password" id="pw2" autocomplete="new-password" placeholder="Re-enter new password" required>
                    <i class="fas fa-eye eye" data-for="pw2" role="button" aria-label="Show password"></i>
                </div>
            </div>
            <button type="submit" class="primary" id="btn"><i class="fas fa-key"></i> Reset password</button>
        </form>

        <a class="back" href="/index.html"><i class="fas fa-arrow-left"></i> Back to login</a>
    </main>

    <!-- public mode: only defines API_BASE (http://<this host>:8091) -->
    <script src="/session.js" data-public="true"></script>
    <script>
        (function () {
            var token = new URLSearchParams(location.search).get('token') || '';
            var form = document.getElementById('form'), btn = document.getElementById('btn');
            var alertBox = document.getElementById('alert'), alertMsg = document.getElementById('alertMsg');
            var pw = document.getElementById('pw'), pw2 = document.getElementById('pw2');

            function show(msg, kind) {
                alertBox.className = 'alert ' + kind;
                alertBox.querySelector('i').className = kind === 'ok' ? 'fas fa-check-circle' : 'fas fa-exclamation-triangle';
                alertMsg.textContent = msg;
                alertBox.style.display = 'flex';
            }

            document.querySelectorAll('i.eye').forEach(function (eye) {
                eye.addEventListener('click', function () {
                    var input = document.getElementById(eye.getAttribute('data-for'));
                    input.type = input.type === 'password' ? 'text' : 'password';
                    eye.classList.toggle('fa-eye-slash');
                });
            });

            if (!token) {
                form.classList.add('hidden');
                show('This reset link is incomplete. Please request a new one from the login page.', 'error');
                return;
            }

            form.addEventListener('submit', function (e) {
                e.preventDefault();
                alertBox.style.display = 'none';
                var a = pw.value, b = pw2.value;

                if (a.length < 8 || !/[A-Za-z]/.test(a) || !/\d/.test(a)) {
                    return show('Password must be at least 8 characters and contain a letter and a number.', 'error');
                }
                if (a !== b) return show('New password and confirm password do not match.', 'error');

                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';

                fetch(window.API_BASE + '/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ token: token, newPassword: a, confirmPassword: b })
                }).then(function (res) {
                    return res.json().catch(function () { return {}; }).then(function (body) {
                        if (!res.ok || body.success === false) {
                            var first = body.errors && body.errors[0] && body.errors[0].message;
                            throw new Error(body.message || first || 'Could not reset the password.');
                        }
                        form.classList.add('hidden');
                        document.getElementById('sub').classList.add('hidden');
                        show(body.message || 'Password reset successful. Redirecting to login...', 'ok');
                        setTimeout(function () { location.href = '/index.html'; }, 2500);
                    });
                }).catch(function (err) {
                    var offline = err instanceof TypeError;
                    show(offline ? 'Cannot reach the server. Please try again later.' : err.message, 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-key"></i> Reset password';
                });
            });
        })();
    </script>
</body>
</html>
